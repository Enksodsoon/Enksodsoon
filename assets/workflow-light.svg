<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
<title id="title">A practical development cycle</title>
<desc id="desc">Understand a real problem, build a solution, test the assumptions, and improve with feedback. Repeat as needed.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0969da"/></marker></defs>
<rect x="1" y="1" width="718" height="278" rx="14" fill="#ffffff" stroke="#d1d9e0"/>
<g fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#arrow)">
<path d="M320 76 H388"/><path d="M676 77 H694 V203 H680"/><path d="M400 204 H332"/><path d="M44 204 H26 V76 H32"/>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<rect x="44" y="30" width="276" height="94" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="62" y="56" font-size="12" font-weight="700" fill="#0969da">01</text>
<text x="96" y="62" font-size="22" font-weight="600" fill="#1f2328">Understand</text>
<text x="62" y="94" font-size="14" fill="#59636e">Find a real problem</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<rect x="400" y="30" width="276" height="94" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="418" y="56" font-size="12" font-weight="700" fill="#0969da">02</text>
<text x="452" y="62" font-size="22" font-weight="600" fill="#1f2328">Build</text>
<text x="418" y="94" font-size="14" fill="#59636e">Explore useful solutions</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<rect x="400" y="158" width="276" height="94" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="418" y="184" font-size="12" font-weight="700" fill="#0969da">03</text>
<text x="452" y="190" font-size="22" font-weight="600" fill="#1f2328">Test</text>
<text x="418" y="222" font-size="14" fill="#59636e">Check evidence and assumptions</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<rect x="44" y="158" width="276" height="94" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="62" y="184" font-size="12" font-weight="700" fill="#0969da">04</text>
<text x="96" y="190" font-size="22" font-weight="600" fill="#1f2328">Improve</text>
<text x="62" y="222" font-size="14" fill="#59636e">Refine with feedback</text>
</g>
</svg>